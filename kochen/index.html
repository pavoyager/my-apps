function rng(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const plateCache = {};
function plate(r) {
  if (plateCache[r.id]) return plateCache[r.id];
  const q = rng(r.seed); let b = '';
  for (let i = 0; i < 11; i++) {
    const a = q() * 6.28, d = q() * 34, x = 100 + Math.cos(a) * d, y = 75 + Math.sin(a) * d * .8, rad = 8 + q() * 15, h = (r.hue + q() * 60 - 30 + 360) % 360;
    b += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${rad.toFixed(1)}" fill="hsl(${h.toFixed(0)} 62% ${(40 + q() * 22).toFixed(0)}%)"/>`;
  }
  return plateCache[r.id] = `<svg viewBox="0 0 200 150" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Platzhalterbild"><rect width="200" height="150" fill="hsl(${r.hue} 34% 76%)"/><circle cx="100" cy="75" r="60" fill="hsl(0 0% 97%)"/><circle cx="100" cy="75" r="49" fill="hsl(${r.hue} 22% 90%)"/>${b}</svg>`;
}

/* Suche: Abstand pro Regler, Ernährung als harter Filter */
function score(r) {
  const d = [];
  for (const k of ['aufwand', 'zutaten', 'deftig']) if (S.q[k].on) d.push(Math.abs(r.tags[k] - S.q[k].v) / 4);
  if (S.q.herkunft.length) d.push(S.q.herkunft.includes(r.tags.herkunft) ? 0 : 1);
  if (!d.length) return null;
  return Math.max(0, Math.round(100 * (1 - 1.5 * d.reduce((a, b) => a + b, 0) / d.length)));
}
function dietOK(r) {
  const d = S.q.diet;
  if (d === 'egal') return true;
  if (d === 'vegan') return r.tags.diet === 'vegan';
  if (d === 'veggie') return r.tags.diet !== 'fleisch';
  return r.tags.diet === 'fleisch';
}

      ${['aufwand', 'zutaten', 'deftig'].map(k => ctl(k, 'f', t[k])).join('')}
      <div class="ctl"><div class="ctl-h"><span class="lbl">Herkunft</span></div><div class="opts" role="group" aria-label="Herkunft">${ORIGINS.map(o => `<button class="opt" type="button" data-act="fOrigin" data-v="${o}" aria-pressed="${t.herkunft === o}">${esc(o)}</button>`).join('')}${F.addOrigin ? '' : `<button class="opt" type="button" data-act="addOrigin">+ Neu</button>`}</div>${F.addOrigin ? `<div class="newo"><input class="inp" id="oNew" type="text" placeholder="z. B. Georgisch oder Bayern" aria-label="Neue Herkunft"><button class="btn ghost inline" type="button" data-act="saveOrigin">Hinzufügen</button></div>` : ''}</div>
      <div class="ctl"><div class="ctl-h"><span class="lbl">Ernährung</span></div><div class="seg" role="group" aria-label="Ernährung">${Object.entries(DIETS).map(([v, l]) => `<button type="button" data-act="fDiet" data-v="${v}" aria-pressed="${t.diet === v}">${l}</button>`).join('')}</div></div>
    </div>
    ${F.err ? `<p class="err">${esc(F.err)}</p>` : ''}
    <button class="btn" type="button" data-act="save">Rezept speichern</button>`;
  document.querySelectorAll('#form .rng').forEach(paintRange);
}

function viewLogin() {
  return `<section class="screen">
    <button class="back" type="button" data-act="back">${ic(I.back, 20)}Zurück</button>
    <div style="display:flex;flex-direction:column;gap:8px"><h1 class="h1">Anmelden</h1>
    <p class="lead">Dein Name und das Passwort, das du bekommen hast.</p></div>
    <div class="card">
      <div class="field"><label class="flabel" for="lName">Name</label><input class="inp" id="lName" type="text" autocomplete="username" autocapitalize="none" placeholder="z. B. mira"></div>
      <div class="field"><label class="flabel" for="lPass">Passwort</label><input class="inp" id="lPass" type="password" autocomplete="current-password"></div>
      <button class="btn" type="button" data-act="sendLink">Anmelden</button>
      <p class="hint">Prototyp: Hier wird noch nichts geprüft.</p>
    </div></section>`;
}

/* Rendern und Navigation */
const TABS = [['search', 'Suchen', I.search], ['browse', 'Rezepte', I.list], ['new', 'Neu', I.plus]];
function renderTabs() {
  const cur = S.tab === 'detail' || S.tab === 'login' ? S.prev : S.tab;
  $('#tabs').innerHTML = TABS.map(([k, l, p]) => `<button class="tab" type="button" data-act="go" data-to="${k}" ${k === cur ? 'aria-current="page"' : ''}><span class="ico">${ic(p)}</span>${l}</button>`).join('');
}
function render() {
  $('#app').innerHTML = ({ search: viewSearch, browse: viewBrowse, new: viewNew, detail: viewDetail, login: viewLogin })[S.tab]();
  if (S.tab === 'search') renderResults();
  if (S.tab === 'browse') renderBrowseList();
  if (S.tab === 'detail') renderIngs();
  if (S.tab === 'new') renderForm();
  document.querySelectorAll('#app .rng').forEach(paintRange);
  renderTabs(); updateJump();
}
function go(to) { if (to !== 'login' && to !== 'detail') S.prev = to; else if (S.tab !== 'detail' && S.tab !== 'login') S.prev = S.tab; S.tab = to; render(); window.scrollTo(0, 0); }
let tt;
function toast(m) { const t = $('#toast'); t.textContent = m; t.hidden = false; clearTimeout(tt); tt = setTimeout(() => { t.hidden = true; }, 2800); }
function setPressed(btn) { btn.parentElement.querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', b === btn ? 'true' : 'false')); }

/* KI-Antwort einlesen */
function applyAI() {
  const raw = F.ai || '', a = raw.indexOf('{'), b = raw.lastIndexOf('}');
  try {
    if (a < 0 || b < a) throw new Error('no json');
    const j = JSON.parse(raw.slice(a, b + 1)), g = j.tags || {};
    const cl = n => Math.min(5, Math.max(1, Math.round(+n) || 3));
    const unit = u => { u = String(u || '').trim(); return u === 'Stück' ? 'Stk' : UNITS.includes(u) ? u : ''; };
    F.title = String(j.titel || '');
    F.portions = Math.min(20, Math.max(1, Math.round(+j.portionen) || 2));
    F.ings = (j.zutaten || []).map(z => ({ a: z.menge == null ? '' : String(z.menge).replace('.', ','), u: unit(z.einheit), n: String(z.name || '') }));
    F.steps = (j.schritte || []).map(String);
    if (!F.ings.length) F.ings = [blankIng()];
    if (!F.steps.length) F.steps = [''];
    F.tags = { aufwand: cl(g.aufwand), zutaten: cl(g.zutaten), deftig: cl(g.deftig), herkunft: (() => { const h = String(g.herkunft || '').trim(); if (!h) return 'Deutsch'; const ex = ORIGINS.find(o => o.toLowerCase() === h.toLowerCase()); if (ex) return ex; ORIGINS.push(h); return h; })(), diet: DIETS[g.ernaehrung] ? g.ernaehrung : 'veggie' };
    F.aiMsg = 'ok'; F.err = '';
  } catch (e) { F.aiMsg = 'err'; }
  const m = $('#aiMsg');
  m.className = 'msg ' + (F.aiMsg === 'ok' ? 'ok' : 'bad');
  m.textContent = F.aiMsg === 'ok' ? 'Übernommen. Prüf unten kurz die Werte.' : 'Das war kein gültiges Rezept-JSON. Kopier die ganze Antwort der KI inklusive der geschweiften Klammern.';
  if (F.aiMsg === 'ok') { renderForm(); $('#form').scrollIntoView(); }
}
const parseAmt = a => { const n = parseFloat(String(a).replace(',', '.')); return isNaN(n) ? null : n; };
function save() {
  const title = F.title.trim(), ings = F.ings.filter(i => i.n.trim()), steps = F.steps.map(s => s.trim()).filter(Boolean), miss = [];
  if (!title) miss.push('einen Namen');
  if (!ings.length) miss.push('mindestens eine Zutat');
  if (!steps.length) miss.push('mindestens einen Schritt');
  if (miss.length) { F.err = 'Es fehlt noch ' + miss.join(', ') + '.'; renderForm(); return; }
  const id = 'u' + Date.now(), hue = Math.floor(Math.random() * 360);
  recipes.unshift({ id, title, author: 'Du', portions: F.portions, hue, seed: Math.floor(Math.random() * 9999), photo: F.photo,
    ing: ings.map(i => [parseAmt(i.a), i.u, i.n.trim()]), steps, tags: { ...F.tags } });
  F = newForm(); S.prev = 'browse'; S.detailId = id; D = { portions: byId(id).portions }; S.tab = 'detail';
  render(); window.scrollTo(0, 0); toast('Rezept gespeichert. Die Runde sieht es jetzt.');
}
function handlePhoto(file) {
  if (!file) return;
  const rd = new FileReader();
  rd.onload = () => {
    const img = new Image();
    img.onload = () => {
      const s = Math.min(1, 1200 / Math.max(img.width, img.height)), c = document.createElement('canvas');
      c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      F.photo = c.toDataURL('image/jpeg', .82);
      const l = $('.photo'); if (l) l.innerHTML = `<img src="${F.photo}" alt="Vorschau">`;
    };
    img.onerror = () => toast('Das Bild konnte nicht gelesen werden.');
    img.src = rd.result;
  };
  rd.readAsDataURL(file);
}

/* Ereignisse */
document.addEventListener('input', e => {
  const t = e.target;
  if (t.classList.contains('rng')) {
    const k = t.dataset.key, v = +t.value, c = t.closest('.ctl');
    if (t.dataset.scope === 'q') { S.q[k].v = v; S.q[k].on = true; } else F.tags[k] = v;
    paintRange(t); c.classList.remove('off');
    c.querySelector('.val').textContent = DIM[k].words[v - 1];
    const eg = c.querySelector('.egal'); if (eg) eg.setAttribute('aria-pressed', 'false');
    if (t.dataset.scope === 'q') renderResults();
    return;
  }
  const f = t.dataset.f, i = +t.dataset.i;
  if (f === 'q') { S.text = t.value; renderBrowseList(); }
  else if (f === 'title') F.title = t.value;
  else if (f === 'ia') F.ings[i].a = t.value;
  else if (f === 'iu') F.ings[i].u = t.value;
  else if (f === 'in') F.ings[i].n = t.value;
  else if (f === 'st') F.steps[i] = t.value;
  else if (f === 'ai') F.ai = t.value;
});
document.addEventListener('change', e => { if (e.target.id === 'photoIn') handlePhoto(e.target.files[0]); });
document.addEventListener('click', async e => {
  const b = e.target.closest('[data-act]'); if (!b) return;
  const a = b.dataset.act, d = b.dataset;
  if (a === 'go') { go(d.to); }
  else if (a === 'open') { S.prev = S.tab; S.scrollY = window.scrollY; S.detailId = d.id; D = { portions: byId(d.id).portions }; S.tab = 'detail'; render(); window.scrollTo(0, 0); }
  else if (a === 'back') { S.tab = S.prev; render(); window.scrollTo(0, S.scrollY || 0); }
  else if (a === 'egal') {
    const k = d.key, c = b.closest('.ctl'); S.q[k].on = !S.q[k].on;
    c.classList.toggle('off', !S.q[k].on); b.setAttribute('aria-pressed', String(!S.q[k].on));
    c.querySelector('.val').textContent = S.q[k].on ? DIM[k].words[S.q[k].v - 1] : 'Egal'; renderResults();
  }
  else if (a === 'origin') {
    const i = S.q.herkunft.indexOf(d.v); if (i >= 0) S.q.herkunft.splice(i, 1); else S.q.herkunft.push(d.v);
    b.setAttribute('aria-pressed', String(i < 0)); $('#v-herkunft').textContent = originVal(); renderResults();
  }
  else if (a === 'diet') { S.q.diet = d.v; setPressed(b); $('#dietHint').textContent = dietHint(); renderResults(); }
  else if (a === 'jump') { $('#results').scrollIntoView(); }
  else if (a === 'pp') { D.portions = Math.min(20, Math.max(1, D.portions + +d.d)); renderIngs(); }
  else if (a === 'fpp') { F.portions = Math.min(20, Math.max(1, F.portions + +d.d)); renderForm(); }
  else if (a === 'addIng') { F.ings.push(blankIng()); renderForm(); }
  else if (a === 'rmIng') { if (F.ings.length > 1) F.ings.splice(+d.i, 1); else F.ings[0] = blankIng(); renderForm(); }
  else if (a === 'addStep') { F.steps.push(''); renderForm(); }
  else if (a === 'rmStep') { if (F.steps.length > 1) F.steps.splice(+d.i, 1); else F.steps[0] = ''; renderForm(); }
  else if (a === 'fOrigin') { F.tags.herkunft = d.v; setPressed(b); }
  else if (a === 'fDiet') { F.tags.diet = d.v; setPressed(b); }
  else if (a === 'addOrigin') { F.addOrigin = true; renderForm(); $('#oNew').focus(); }
  else if (a === 'saveOrigin') {
    const v = $('#oNew').value.trim();
    if (!v) { toast('Gib erst einen Namen ein.'); return; }
    const ex = ORIGINS.find(o => o.toLowerCase() === v.toLowerCase()), name = ex || v;
    if (!ex) ORIGINS.push(name);
    F.tags.herkunft = name; F.addOrigin = false; renderForm();
    toast(ex ? name + ' gab es schon und ist jetzt gewählt.' : 'Neue Herkunft angelegt: ' + name);
  }
  else if (a === 'save') save();
  else if (a === 'applyAI') applyAI();
  else if (a === 'sample') { F.ai = SAMPLE; $('#aiIn').value = SAMPLE; applyAI(); }
  else if (a === 'copyPrompt') {
    try { await navigator.clipboard.writeText(PROMPT); toast('Prompt kopiert. Jetzt in Claude oder ChatGPT einfügen.'); }
    catch (err) { const dt = $('#promptDet'); dt.open = true; const ta = $('#promptTa'); ta.focus(); ta.select(); toast('Prompt markiert. Jetzt kopieren.'); }
  }
  else if (a === 'sendLink') { S.tab = 'search'; render(); window.scrollTo(0, 0); toast('Prototyp: Hier würde der Login geprüft.'); }
});
window.addEventListener('scroll', updateJump, { passive: true });
window.addEventListener('resize', updateJump);

render();
</script>
