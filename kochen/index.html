<style>
/* Layout: einspaltige Handy-App (max 520px) mit Tab-Leiste unten. Der Such-Screen ist ein Regler-Panel, darunter sortieren sich die Rezepte live nach Treffer. */
:root {
  color-scheme: light;
  --bg: #F1F5F0;
  --surface: #FFFFFF;
  --surface-2: #E6EDE6;
  --ink: #14201A;
  --muted: #58675E;
  --line: #D7DFD7;
  --accent: #F0B323;
  --accent-ink: #1B1604;
  --forest: #1F5C45;
  --vegan: #17623D;  --vegan-bg: #D6EDDF;
  --veggie: #4E6C0E; --veggie-bg: #E8F0CC;
  --fisch: #1F5A8A; --fisch-bg: #D9E8F5;
  --fleisch: #9B3F25; --fleisch-bg: #F6DDD3;
  --err: #B3261E;
  --font-display: 'Bricolage Grotesque', 'Trebuchet MS', system-ui, sans-serif;
  --font-body: 'Instrument Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0E1511; --surface: #17211B; --surface-2: #213028; --ink: #E8EFE9; --muted: #9AAAA0; --line: #2B3A31;
    --accent: #F2B83A; --accent-ink: #1A1400; --forest: #7FD1A8;
    --vegan: #7FDBA8; --vegan-bg: #1B3A2A; --veggie: #C8E07A; --veggie-bg: #323B17; --fisch: #8FC4F0; --fisch-bg: #1B3347; --fleisch: #F3A98F; --fleisch-bg: #44261C;
    --err: #FFB4AB;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0E1511; --surface: #17211B; --surface-2: #213028; --ink: #E8EFE9; --muted: #9AAAA0; --line: #2B3A31;
  --accent: #F2B83A; --accent-ink: #1A1400; --forest: #7FD1A8;
  --vegan: #7FDBA8; --vegan-bg: #1B3A2A; --veggie: #C8E07A; --veggie-bg: #323B17; --fisch: #8FC4F0; --fisch-bg: #1B3347; --fleisch: #F3A98F; --fleisch-bg: #44261C;
  --err: #FFB4AB;
  color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
img { max-width: 100%; }
html { background: var(--bg); touch-action: pan-x pan-y; }
body {
  margin: 0;
  background: var(--bg); color: var(--ink);
  font-family: var(--font-body); font-size: 15px; line-height: 1.45;
  padding-top: calc(14px + env(safe-area-inset-top, 0px));
  padding-bottom: 120px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  -webkit-text-size-adjust: 100%;
}
button { font: inherit; color: inherit; cursor: pointer; -webkit-tap-highlight-color: transparent; }
button:disabled { opacity: .6; cursor: default; }
:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
h1, h2, h3 { font-family: var(--font-display); margin: 0; text-wrap: balance; }
p { margin: 0; }
form { margin: 0; display: contents; }
.app { max-width: 520px; margin-inline: auto; }
.screen { display: flex; flex-direction: column; gap: 18px; }

.top { display: flex; align-items: center; justify-content: space-between; min-height: 44px; }
.mark { display: flex; align-items: center; gap: 8px; font-family: var(--font-display); font-weight: 800; font-size: 21px; letter-spacing: -.02em; }
.mark svg { color: var(--forest); }
.me { width: 42px; height: 42px; border-radius: 50%; border: 0; background: var(--surface-2); font-weight: 700; font-size: 15px; text-transform: uppercase; }
.h1 { font-size: 32px; line-height: 1.05; font-weight: 700; letter-spacing: -.025em; }
.h1.sm { font-size: 28px; }
.lead { color: var(--muted); max-width: 40ch; }
.by { color: var(--muted); margin-top: 4px; }
.back { display: inline-flex; align-items: center; gap: 4px; align-self: flex-start; min-height: 44px; padding: 0 12px 0 6px; border: 0; background: none; font-weight: 600; color: var(--forest); }

.panel { background: var(--surface); border-radius: 22px; padding: 4px 18px; }
.ctl { padding: 16px 0 14px; border-bottom: 1px solid var(--line); }
.ctl:last-child { border-bottom: 0; }
.ctl-h { display: flex; align-items: center; gap: 10px; min-height: 34px; }
.lbl { font-family: var(--font-display); font-weight: 700; font-size: 18px; letter-spacing: -.01em; }
.val { flex: 1; min-width: 0; text-align: right; color: var(--muted); font-weight: 600; }
.ctl:not(.off) .val { color: var(--ink); }
.egal { padding: 6px 12px; min-height: 34px; border-radius: 999px; border: 1.5px solid var(--line); background: transparent; font-size: 13px; font-weight: 600; }
.egal[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.ctl.off .rng, .ctl.off .ticks, .ctl.off .ends { opacity: .38; }

.rng { -webkit-appearance: none; appearance: none; display: block; width: 100%; height: 38px; margin: 2px 0 0; background: transparent; --p: 50%; touch-action: pan-y; }
.rng::-webkit-slider-runnable-track { height: 10px; border-radius: 6px; background: linear-gradient(to right, var(--accent) var(--p), var(--surface-2) var(--p)); }
.rng::-webkit-slider-thumb { -webkit-appearance: none; width: 32px; height: 32px; margin-top: -11px; border-radius: 50%; background: var(--accent); border: 3px solid var(--ink); box-shadow: 0 2px 6px rgba(0,0,0,.22); }
.rng::-moz-range-track { height: 10px; border-radius: 6px; background: var(--surface-2); }
.rng::-moz-range-progress { height: 10px; border-radius: 6px; background: var(--accent); }
.rng::-moz-range-thumb { width: 26px; height: 26px; border-radius: 50%; background: var(--accent); border: 3px solid var(--ink); }
.ticks { display: flex; justify-content: space-between; padding: 0 14px; margin-top: -1px; }
.ticks i { width: 4px; height: 4px; border-radius: 50%; background: var(--line); }
.ends { display: flex; justify-content: space-between; margin-top: 6px; font-size: 13px; color: var(--muted); }

.opts { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
.opt { min-height: 44px; padding: 0 16px; border-radius: 999px; border: 1.5px solid var(--line); background: transparent; font-weight: 600; font-size: 14px; }
.opt[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 4px; margin-top: 10px; padding: 4px; border-radius: 16px; background: var(--surface-2); }
.seg button { min-height: 44px; padding: 0 4px; border: 0; border-radius: 12px; background: transparent; font-weight: 600; font-size: 14px; }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
.newo { display: flex; gap: 8px; margin-top: 10px; }
.newo .inp { min-width: 0; }
.newo .btn { flex: none; min-height: 48px; }
.hint { margin-top: 8px; font-size: 13px; color: var(--muted); min-height: 1.4em; }

.res-h { display: flex; align-items: baseline; justify-content: space-between; padding-bottom: 4px; }
.res-h h2 { font-size: 22px; letter-spacing: -.02em; }
.res-h span { color: var(--muted); font-size: 13px; }
.row { display: grid; grid-template-columns: 92px minmax(0, 1fr); gap: 14px; width: 100%; padding: 14px 0; border: 0; border-bottom: 1px solid var(--line); background: none; text-align: left; }
.rb { min-width: 0; display: flex; flex-direction: column; gap: 4px; }
.rt { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; }
.rtitle { font-family: var(--font-display); font-weight: 700; font-size: 17px; line-height: 1.2; letter-spacing: -.01em; overflow-wrap: anywhere; }
.rmeta { font-size: 13px; color: var(--muted); }
.pill { font-size: 12px; font-weight: 700; padding: 3px 8px; border-radius: 999px; background: var(--surface-2); color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; }
.pill.hi { background: var(--accent); color: var(--accent-ink); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 2px; }
.chip { font-size: 12px; font-weight: 600; padding: 3px 9px; border-radius: 999px; background: var(--surface-2); color: var(--muted); }
.chip.vegan { background: var(--vegan-bg); color: var(--vegan); }
.chip.veggie { background: var(--veggie-bg); color: var(--veggie); }
.chip.fisch { background: var(--fisch-bg); color: var(--fisch); }
.chip.fleisch { background: var(--fleisch-bg); color: var(--fleisch); }
.empty { padding: 24px 0; color: var(--muted); display: flex; flex-direction: column; gap: 12px; align-items: flex-start; }

.pic { position: relative; overflow: hidden; border-radius: 16px; aspect-ratio: 1; background: var(--surface-2); }
.pic svg, .pic img { display: block; width: 100%; height: 100%; object-fit: cover; }
.pic.big { aspect-ratio: 16 / 10; border-radius: 24px; }
.pic.wide { aspect-ratio: 4 / 3; }

.inp { width: 100%; min-height: 48px; padding: 12px 14px; border: 1.5px solid var(--line); border-radius: 14px; background: var(--surface); color: var(--ink); font: inherit; font-size: 16px; }
textarea.inp { resize: vertical; min-height: 64px; }
.grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 20px 14px; }
.tile { display: flex; flex-direction: column; gap: 8px; padding: 0; border: 0; background: none; text-align: left; min-width: 0; }
.tile .rtitle { font-size: 16px; }

.tagsum { padding: 16px 18px; display: flex; flex-direction: column; gap: 12px; }
.trow { display: grid; grid-template-columns: 108px auto minmax(0, 1fr); gap: 12px; align-items: center; font-size: 14px; }
.trow .tl { color: var(--muted); }
.trow .tw { text-align: right; font-weight: 600; }
.segs { display: flex; gap: 4px; }
.segs i { width: 16px; height: 8px; border-radius: 3px; background: var(--surface-2); }
.segs i.f { background: var(--accent); }
.sec { display: flex; flex-direction: column; gap: 10px; }
.sec-h { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.sec h2 { font-size: 22px; letter-spacing: -.02em; }
.stepper { display: inline-flex; align-items: center; gap: 4px; padding: 4px; border-radius: 16px; background: var(--surface-2); }
.stepper button { width: 44px; height: 44px; border: 0; border-radius: 12px; background: var(--surface); font-size: 22px; font-weight: 600; line-height: 1; }
.stepper span { min-width: 92px; text-align: center; font-weight: 600; font-variant-numeric: tabular-nums; }
.ing { list-style: none; margin: 0; padding: 0; }
.ing li { display: grid; grid-template-columns: 78px minmax(0, 1fr); gap: 12px; padding: 11px 0; border-bottom: 1px solid var(--line); overflow-wrap: anywhere; }
.ing .am { text-align: right; font-weight: 700; font-variant-numeric: tabular-nums; }
.steps { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 16px; counter-reset: s; }
.step { display: grid; grid-template-columns: 30px minmax(0, 1fr); gap: 12px; align-items: start; counter-increment: s; overflow-wrap: anywhere; }
.step::before { content: counter(s); width: 30px; height: 30px; border-radius: 50%; background: var(--ink); color: var(--bg); display: grid; place-items: center; font-weight: 700; font-size: 14px; }
.step > span { padding-top: 3px; }
.own { display: flex; flex-direction: column; gap: 10px; padding-top: 6px; }
.own-row { display: flex; gap: 10px; flex-wrap: wrap; }

.card { background: var(--surface); border-radius: 22px; padding: 18px; display: flex; flex-direction: column; gap: 14px; }
.card h2 { font-size: 20px; letter-spacing: -.015em; }
.how { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 14px; counter-reset: h; }
.how > li { counter-increment: h; display: grid; grid-template-columns: 28px minmax(0, 1fr); gap: 12px; align-items: start; }
.how > li::before { content: counter(h); width: 28px; height: 28px; border-radius: 50%; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; font-weight: 700; font-size: 14px; }
.how .b { display: flex; flex-direction: column; gap: 8px; min-width: 0; padding-top: 3px; }
.btn { min-height: 52px; padding: 0 20px; border: 0; border-radius: 16px; background: var(--accent); color: var(--accent-ink); font-family: var(--font-display); font-weight: 700; font-size: 17px; width: 100%; }
.btn.ghost { background: transparent; border: 1.5px solid var(--line); color: var(--ink); font-family: var(--font-body); font-size: 15px; font-weight: 600; min-height: 46px; }
.btn.danger { background: var(--err); color: var(--bg); font-family: var(--font-body); font-size: 15px; min-height: 46px; }
.btn.inline { width: auto; align-self: flex-start; }
.link { align-self: flex-start; min-height: 40px; padding: 0; border: 0; background: none; color: var(--forest); font-weight: 600; text-decoration: underline; text-underline-offset: 3px; }
.msg { font-size: 14px; }
.msg.ok { color: var(--vegan); }
.msg.bad, .err { color: var(--err); font-weight: 600; }
details summary { cursor: pointer; font-weight: 600; color: var(--forest); min-height: 36px; display: flex; align-items: center; }
.mono { font-family: ui-monospace, 'SF Mono', Menlo, monospace; font-size: 16px; line-height: 1.4; }
.field { display: flex; flex-direction: column; gap: 8px; }
.flabel { font-size: 12px; font-weight: 700; letter-spacing: .07em; text-transform: uppercase; color: var(--muted); }
.photo { display: grid; place-items: center; aspect-ratio: 16 / 10; max-width: 100%; border: 2px dashed var(--line); border-radius: 22px; background: var(--surface); overflow: hidden; cursor: pointer; color: var(--muted); text-align: center; }
.photo img { width: 100%; height: 100%; object-fit: cover; display: block; }
.ph { display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 12px; }
.vh { position: absolute; width: 1px; height: 1px; opacity: 0; overflow: hidden; clip: rect(0 0 0 0); }
.irow { display: grid; grid-template-columns: 66px 80px minmax(0, 1fr) 40px; gap: 8px; margin-bottom: 8px; }
.irow .inp { min-width: 0; padding-inline: 10px; }
.x { width: 40px; height: 48px; border: 0; background: none; color: var(--muted); display: grid; place-items: center; padding: 0; }
.srow { display: grid; grid-template-columns: 30px minmax(0, 1fr) 40px; gap: 8px; align-items: start; margin-bottom: 10px; counter-increment: s; }
.srow::before { content: counter(s); margin-top: 9px; width: 30px; height: 30px; border-radius: 50%; background: var(--ink); color: var(--bg); display: grid; place-items: center; font-weight: 700; font-size: 14px; }
.srows { counter-reset: s; }

.login { min-height: calc(100dvh - 60px); justify-content: center; }

.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: var(--surface); border-top: 1px solid var(--line);
  padding: 8px max(16px, env(safe-area-inset-right, 0px)) calc(8px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.tabs-in { max-width: 520px; margin: 0 auto; display: flex; }
.tab { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 0; border: 0; background: none; font-size: 12px; font-weight: 600; color: var(--muted); }
.tab .ico { width: 58px; height: 30px; border-radius: 15px; display: grid; place-items: center; }
.tab[aria-current="page"] { color: var(--ink); }
.tab[aria-current="page"] .ico { background: var(--accent); color: var(--accent-ink); }
.jump { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(82px + env(safe-area-inset-bottom, 0px)); z-index: 15; display: flex; align-items: center; gap: 6px; min-height: 44px; padding: 0 18px; border: 0; border-radius: 999px; background: var(--ink); color: var(--bg); font-weight: 700; box-shadow: 0 6px 20px rgba(0,0,0,.25); }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(86px + env(safe-area-inset-bottom, 0px)); z-index: 30; width: max-content; max-width: calc(100vw - 40px); padding: 12px 18px; border-radius: 14px; background: var(--ink); color: var(--bg); font-weight: 600; text-align: center; }
@media (prefers-reduced-motion: no-preference) { html { scroll-behavior: smooth; } }
</style>

  const add = h => { h = String(h || '').trim(); if (h && !seen.has(h.toLowerCase())) seen.set(h.toLowerCase(), h); };

  const extra = [...seen.values()].filter(o => !BASE_ORIGINS.includes(o)).sort((a, b) => a.localeCompare(b, 'de'));
  ORIGINS.length = 0; ORIGINS.push(...BASE_ORIGINS, ...extra);
}

/* ---------- Daten laden ---------- */
function fromRow(x, names) {
  return {
    id: x.id, title: x.title, authorId: x.author_id, author: names[x.author_id] || 'Unbekannt', portions: x.portions,
    ing: (x.ingredients || []).map(i => [i.menge ?? null, i.einheit || '', i.name || '']), steps: x.steps || [],
    photoPath: x.photo_path || null,
    photo: x.photo_path ? sb.storage.from('recipe-photos').getPublicUrl(x.photo_path).data.publicUrl : null,
    hue: hash(x.id) % 360, seed: hash(x.id) % 9973 + 1,
    tags: { aufwand: x.aufwand, zutaten: x.zutaten, deftig: x.deftig, gesund: x.gesund ?? 3, herkunft: x.herkunft, diet: x.ernaehrung }
  };
}
async function loadRecipes() {
  S.loading = true; S.loadErr = '';
  try {
    const [r, p] = await Promise.all([
      sb.from('recipes').select('*').order('created_at', { ascending: false }),
      sb.from('profiles').select('id,name')
    ]);
    if (r.error) throw r.error;
    const names = {}; (p.data || []).forEach(x => { names[x.id] = x.name; });
    recipes = (r.data || []).map(x => fromRow(x, names));
    S.lastLoad = Date.now();
  } catch (e) {
    S.loadErr = 'Die Rezepte konnten nicht geladen werden. Prüf die Internetverbindung.';
  }
  S.loading = false;
  rebuildOrigins();
}

/* ---------- Bilder ---------- */
function rng(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const plateCache = {};
function plate(r) {
  if (plateCache[r.id]) return plateCache[r.id];
  const q = rng(r.seed); let b = '';
  for (let i = 0; i < 11; i++) {
    const a = q() * 6.28, d = q() * 34, x = 100 + Math.cos(a) * d, y = 75 + Math.sin(a) * d * .8, rad = 8 + q() * 15, h = (r.hue + q() * 60 - 30 + 360) % 360;
    b += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${rad.toFixed(1)}" fill="hsl(${h.toFixed(0)} 62% ${(40 + q() * 22).toFixed(0)}%)"/>`;
  }
  return plateCache[r.id] = `<svg viewBox="0 0 200 150" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Platzhalterbild"><rect width="200" height="150" fill="hsl(${r.hue} 34% 76%)"/><circle cx="100" cy="75" r="60" fill="hsl(0 0% 97%)"/><circle cx="100" cy="75" r="49" fill="hsl(${r.hue} 22% 90%)"/>${b}</svg>`;
}
const pic = r => r.photo ? `<img src="${esc(r.photo)}" alt="${esc(r.title)}" loading="lazy" decoding="async">` : plate(r);

/* ---------- Suche ---------- */
function score(r) {
  const d = [];
  for (const k of KEYS) if (S.q[k].on) d.push(Math.abs(r.tags[k] - S.q[k].v) / 4);
  if (S.q.herkunft.length) d.push(S.q.herkunft.includes(r.tags.herkunft) ? 0 : 1);
  if (!d.length) return null;
  return Math.max(0, Math.round(100 * (1 - 1.5 * d.reduce((a, b) => a + b, 0) / d.length)));
}
function dietOK(r) {
  const d = S.q.diet;
  if (d === 'egal') return true;
  if (d === 'vegan') return r.tags.diet === 'vegan';
  if (d === 'veggie') return r.tags.diet === 'vegan' || r.tags.diet === 'veggie';
  return r.tags.diet === d;
}

function fmtAmt(a, u, f) {
  if (a == null) return '';
  const n = a * f;

  if (u === 'kg' || u === 'l') return String(Math.round(n * 10) / 10).replace('.', ',');
  const q = Math.max(0.25, Math.round(n * 4) / 4), w = Math.floor(q), fr = ({ 0: '', 0.25: '¼', 0.5: '½', 0.75: '¾' })[q - w];
  return (w ? String(w) : '') + fr;
}

  $('#tabs').innerHTML = TABS.map(([k, l, p]) => `<button class="tab" type="button" data-act="go" data-to="${k}" ${k === cur ? 'aria-current="page"' : ''}><span class="ico">${ic(p)}</span>${l}</button>`).join('');
}
function render() {
  if (!S.user) S.tab = 'login';
  if (S.tab === 'detail' && !byId(S.detailId)) S.tab = S.prev;
  $('#tabsNav').hidden = !S.user;
  $('#app').innerHTML = ({ login: viewLogin, search: viewSearch, browse: viewBrowse, new: viewNew, detail: viewDetail, account: viewAccount })[S.tab]();
  if (S.tab === 'search') renderResults();
  if (S.tab === 'browse') renderBrowseList();
  if (S.tab === 'detail') renderIngs();
  if (S.tab === 'new') renderForm();
  document.querySelectorAll('#app .rng').forEach(paintRange);
  if (S.user) renderTabs();
  updateJump();
}
function go(to) {
  if (!SUB.includes(to)) S.prev = to; else if (!SUB.includes(S.tab)) S.prev = S.tab;
  S.tab = to; S.confirmDel = null; render(); window.scrollTo(0, 0);
}
let tt;
function toast(m) { const t = $('#toast'); t.textContent = m; t.hidden = false; clearTimeout(tt); tt = setTimeout(() => { t.hidden = true; }, 3200); }
function setPressed(btn) { btn.parentElement.querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', b === btn ? 'true' : 'false')); }

/* ---------- Anmelden ---------- */
const nameOf = email => String(email || '').split('@')[0];
async function enter(user) {
  S.user = { id: user.id, name: nameOf(user.email) };
  S.tab = 'search'; S.prev = 'search'; S.loading = true; render();
  await loadRecipes();
  render();
}
async function doLogin() {
  const name = $('#lName').value.trim().toLowerCase().replace(/\s+/g, ''), pw = $('#lPass').value, msg = $('#lMsg'), btn = $('#lBtn');
  if (!sb) return;
  if (!name || !pw) { msg.textContent = 'Bitte Name und Passwort eintragen.'; return; }
  btn.disabled = true; btn.textContent = 'Melde an …'; msg.textContent = '';
  try {
    const { data, error } = await sb.auth.signInWithPassword({ email: `${name}@${EMAIL_DOMAIN}`, password: pw });
    if (error) throw error;
    await enter(data.user);
  } catch (e) {
    const net = /fetch|network/i.test(String(e && e.message));
    msg.textContent = net ? 'Keine Verbindung zum Server. Prüf das Internet.' : 'Name oder Passwort stimmt nicht.';
    btn.disabled = false; btn.textContent = 'Anmelden';
  }
}
async function boot() {
  if (!sb) { render(); return; }
  sb.auth.onAuthStateChange(ev => { if (ev === 'SIGNED_OUT' && S.user) { S.user = null; recipes = []; F = newForm(); render(); } });
  try {
    const { data } = await sb.auth.getSession();
    if (data && data.session) { await enter(data.session.user); return; }
  } catch (e) { /* weiter zum Login */ }
  render();
}

/* ---------- KI-Antwort einlesen ---------- */
function applyAI() {
  const raw = F.ai || '', a = raw.indexOf('{'), b = raw.lastIndexOf('}');
  try {
    if (a < 0 || b < a) throw new Error('no json');
    const j = JSON.parse(raw.slice(a, b + 1)), g = j.tags || {};
    const cl = n => Math.min(5, Math.max(1, Math.round(+n) || 3));
    const unit = u => { u = String(u || '').trim(); return u === 'Stück' ? 'Stk' : UNITS.includes(u) ? u : ''; };
    F.title = String(j.titel || '');
    F.portions = Math.min(50, Math.max(1, Math.round(+j.portionen) || 2));
    F.ings = (j.zutaten || []).map(z => ({ a: z.menge == null ? '' : String(z.menge).replace('.', ','), u: unit(z.einheit), n: String(z.name || '') }));
    F.steps = (j.schritte || []).map(String);
    if (!F.ings.length) F.ings = [blankIng()];
    if (!F.steps.length) F.steps = [''];
    const h = String(g.herkunft || '').trim();
    F.tags = { aufwand: cl(g.aufwand), zutaten: cl(g.zutaten), deftig: cl(g.deftig), gesund: cl(g.gesund), herkunft: h || 'Deutsch', diet: DIETS[g.ernaehrung] ? g.ernaehrung : 'veggie' };
    rebuildOrigins();
    F.aiMsg = 'ok'; F.err = '';
  } catch (e) { F.aiMsg = 'err'; }
  const m = $('#aiMsg');
  m.className = 'msg ' + (F.aiMsg === 'ok' ? 'ok' : 'bad');
  m.textContent = F.aiMsg === 'ok' ? 'Übernommen. Prüf unten kurz die Werte.' : 'Das war kein gültiges Rezept-JSON. Kopier die ganze Antwort der KI inklusive der geschweiften Klammern.';
  if (F.aiMsg === 'ok') { renderForm(); $('#form').scrollIntoView(); }
}

/* ---------- Speichern, Bearbeiten, Löschen ---------- */
const parseAmt = a => { const n = parseFloat(String(a).replace(',', '.')); return isNaN(n) ? null : n; };
async function save() {
  if (S.saving) return;
  const title = F.title.trim(), ings = F.ings.filter(i => i.n.trim()), steps = F.steps.map(s => s.trim()).filter(Boolean), miss = [];
  if (!title) miss.push('einen Namen');
  if (!ings.length) miss.push('mindestens eine Zutat');
  if (!steps.length) miss.push('mindestens einen Schritt');
  if (miss.length) { F.err = 'Es fehlt noch ' + miss.join(', ') + '.'; renderForm(); return; }
  S.saving = true; F.err = ''; renderForm();
  try {
    let path = F.photoPath || null;
    if (F.photoBlob) {
      const p = `${S.user.id}/${uuid()}.jpg`;
      const up = await sb.storage.from('recipe-photos').upload(p, F.photoBlob, { contentType: 'image/jpeg', cacheControl: '31536000' });
      if (up.error) throw up.error;
      path = p;
    }
    const row = { title, portions: F.portions, photo_path: path,
      ingredients: ings.map(i => ({ menge: parseAmt(i.a), einheit: i.u, name: i.n.trim() })), steps,
      aufwand: F.tags.aufwand, zutaten: F.tags.zutaten, deftig: F.tags.deftig, gesund: F.tags.gesund, herkunft: F.tags.herkunft, ernaehrung: F.tags.diet };
    const res = F.editId
      ? await sb.from('recipes').update(row).eq('id', F.editId).select().single()
      : await sb.from('recipes').insert(row).select().single();
    if (res.error) throw res.error;
    const id = res.data.id, wasEdit = !!F.editId;
    F = newForm();
    await loadRecipes();
    S.saving = false; S.prev = 'browse'; S.detailId = id; D = { portions: byId(id) ? byId(id).portions : 2 }; S.tab = 'detail';
    render(); window.scrollTo(0, 0);
    toast(wasEdit ? 'Änderungen gespeichert.' : 'Rezept gespeichert. Die Runde sieht es jetzt.');
  } catch (e) {
    S.saving = false;
    F.err = 'Speichern hat nicht geklappt: ' + ((e && e.message) || 'unbekannter Fehler') + '. Deine Eingaben sind noch da, versuch es nochmal.';
    renderForm();
  }
}
function startEdit() {
  const r = byId(S.detailId); if (!r) return;
  F = { ...newForm(), editId: r.id, title: r.title, portions: r.portions, photo: r.photo, photoPath: r.photoPath,
    ings: r.ing.map(([a, u, n]) => ({ a: a == null ? '' : String(a).replace('.', ','), u: UNITS.includes(u) ? u : '', n })),
    steps: [...r.steps], tags: { ...r.tags } };
  rebuildOrigins(); S.tab = 'new'; S.confirmDel = null; render(); window.scrollTo(0, 0);
}
async function deleteRecipe() {
  const id = S.detailId;
  const { error } = await sb.from('recipes').delete().eq('id', id);
  if (error) { toast('Löschen hat nicht geklappt: ' + error.message); return; }
  S.confirmDel = null; await loadRecipes();
  S.tab = S.prev === 'new' ? 'browse' : S.prev; render(); window.scrollTo(0, 0); toast('Rezept gelöscht.');
}
function handlePhoto(file) {
  if (!file) return;
  const rd = new FileReader();
  rd.onload = () => {
    const img = new Image();
    img.onload = () => {
      const s = Math.min(1, 1200 / Math.max(img.width, img.height)), c = document.createElement('canvas');
      c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      c.toBlob(blob => {
        if (!blob) { toast('Das Bild konnte nicht verarbeitet werden.'); return; }
        F.photoBlob = blob; F.photo = URL.createObjectURL(blob);
        const l = $('.photo'); if (l) l.innerHTML = `<img src="${F.photo}" alt="Vorschau">`;
      }, 'image/jpeg', .82);
    };
    img.onerror = () => toast('Das Bild konnte nicht gelesen werden.');
    img.src = rd.result;
  };
  rd.readAsDataURL(file);
}

/* ---------- Ereignisse ---------- */
document.addEventListener('input', e => {
  const t = e.target;
  if (t.classList.contains('rng')) {
    const k = t.dataset.key, v = +t.value, c = t.closest('.ctl');
    if (t.dataset.scope === 'q') { S.q[k].v = v; S.q[k].on = true; } else F.tags[k] = v;
    paintRange(t); c.classList.remove('off');
    c.querySelector('.val').textContent = DIM[k].words[v - 1];
    const eg = c.querySelector('.egal'); if (eg) eg.setAttribute('aria-pressed', 'false');
    if (t.dataset.scope === 'q') renderResults();
    return;
  }
  const f = t.dataset.f, i = +t.dataset.i;
  if (f === 'q') { S.text = t.value; renderBrowseList(); }
  else if (f === 'title') F.title = t.value;
  else if (f === 'ia') F.ings[i].a = t.value;
  else if (f === 'iu') F.ings[i].u = t.value;
  else if (f === 'in') F.ings[i].n = t.value;
  else if (f === 'st') F.steps[i] = t.value;
  else if (f === 'ai') F.ai = t.value;
});
document.addEventListener('change', e => { if (e.target.id === 'photoIn') handlePhoto(e.target.files[0]); });
document.addEventListener('submit', async e => {
  e.preventDefault();
  if (e.target.id === 'loginForm') doLogin();
  if (e.target.id === 'pwForm') {
    const pw = $('#pw1').value, m = $('#pwMsg');
    if (pw.length < 6) { m.className = 'msg bad'; m.textContent = 'Mindestens 6 Zeichen.'; return; }
    const { error } = await sb.auth.updateUser({ password: pw });
    m.className = 'msg ' + (error ? 'bad' : 'ok');
    m.textContent = error ? 'Das hat nicht geklappt: ' + error.message : 'Passwort geändert.';
    if (!error) $('#pw1').value = '';
  }
});
document.addEventListener('click', async e => {
  const b = e.target.closest('[data-act]'); if (!b) return;
  const a = b.dataset.act, d = b.dataset;
  if (a === 'go') { if (d.to === 'new' && F.editId) F = newForm(); go(d.to); }
  else if (a === 'open') { S.prev = S.tab; S.scrollY = window.scrollY; S.detailId = d.id; S.confirmDel = null; D = { portions: byId(d.id).portions }; S.tab = 'detail'; render(); window.scrollTo(0, 0); }
  else if (a === 'back') { S.tab = S.prev; S.confirmDel = null; render(); window.scrollTo(0, S.scrollY || 0); }
  else if (a === 'egal') {
    const k = d.key, c = b.closest('.ctl'); S.q[k].on = !S.q[k].on;
    c.classList.toggle('off', !S.q[k].on); b.setAttribute('aria-pressed', String(!S.q[k].on));
    c.querySelector('.val').textContent = S.q[k].on ? DIM[k].words[S.q[k].v - 1] : 'Egal'; renderResults();
  }
  else if (a === 'origin') {
    const i = S.q.herkunft.indexOf(d.v); if (i >= 0) S.q.herkunft.splice(i, 1); else S.q.herkunft.push(d.v);
    b.setAttribute('aria-pressed', String(i < 0)); $('#v-herkunft').textContent = originVal(); renderResults();
  }
  else if (a === 'diet') { S.q.diet = d.v; setPressed(b); $('#dietHint').textContent = dietHint(); renderResults(); }
  else if (a === 'jump') { $('#results').scrollIntoView(); }
  else if (a === 'pp') { D.portions = Math.min(50, Math.max(1, D.portions + +d.d)); renderIngs(); }
  else if (a === 'fpp') { F.portions = Math.min(50, Math.max(1, F.portions + +d.d)); renderForm(); }
  else if (a === 'addIng') { F.ings.push(blankIng()); renderForm(); }
  else if (a === 'rmIng') { if (F.ings.length > 1) F.ings.splice(+d.i, 1); else F.ings[0] = blankIng(); renderForm(); }
  else if (a === 'addStep') { F.steps.push(''); renderForm(); }
  else if (a === 'rmStep') { if (F.steps.length > 1) F.steps.splice(+d.i, 1); else F.steps[0] = ''; renderForm(); }
  else if (a === 'fOrigin') { F.tags.herkunft = d.v; setPressed(b); }
  else if (a === 'fDiet') { F.tags.diet = d.v; setPressed(b); }
  else if (a === 'addOrigin') { F.addOrigin = true; renderForm(); $('#oNew').focus(); }
  else if (a === 'saveOrigin') {
    const v = $('#oNew').value.trim();
    if (!v) { toast('Gib erst einen Namen ein.'); return; }
    const ex = ORIGINS.find(o => o.toLowerCase() === v.toLowerCase()), name = ex || v;
    F.tags.herkunft = name; F.addOrigin = false; rebuildOrigins(); renderForm();
    toast(ex ? name + ' gab es schon und ist jetzt gewählt.' : 'Neue Herkunft angelegt: ' + name);
  }
  else if (a === 'save') save();
  else if (a === 'applyAI') applyAI();
  else if (a === 'copyPrompt') {
    try { await navigator.clipboard.writeText(buildPrompt()); toast('Prompt kopiert. Jetzt in Claude oder ChatGPT einfügen.'); }
    catch (err) { $('#promptDet').open = true; const ta = $('#promptTa'); ta.focus(); ta.select(); toast('Prompt markiert. Jetzt kopieren.'); }
  }
  else if (a === 'edit') startEdit();
  else if (a === 'cancelEdit') { F = newForm(); S.tab = 'detail'; render(); window.scrollTo(0, 0); }
  else if (a === 'delAsk') { S.confirmDel = S.detailId; render(); }
  else if (a === 'delNo') { S.confirmDel = null; render(); }
  else if (a === 'delYes') deleteRecipe();
  else if (a === 'logout') { await sb.auth.signOut(); }
  else if (a === 'reload') { S.loading = true; render(); await loadRecipes(); render(); }
});
window.addEventListener('scroll', updateJump, { passive: true });
window.addEventListener('resize', updateJump);
document.addEventListener('visibilitychange', async () => {
  if (document.hidden || !S.user || S.loading || S.saving || Date.now() - S.lastLoad < 60000) return;
  if (S.tab !== 'search' && S.tab !== 'browse') return;
  const typing = document.activeElement && /INPUT|TEXTAREA/.test(document.activeElement.tagName);
  await loadRecipes();
  if (!typing && (S.tab === 'search' || S.tab === 'browse')) render();
});

boot();
</script>
</body>
</html>
