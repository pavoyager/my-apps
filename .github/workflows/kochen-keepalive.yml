# Gehört nach .github/workflows/kochen-keepalive.yml (Repo-Stamm)
name: "Kochen - Supabase wachhalten"
on:
  schedule:
    - cron: '17 6 * * *'   # täglich, 06:17 UTC
  workflow_dispatch:        # zusätzlich per Knopfdruck im Actions-Tab
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Datenbank anfragen
        run: |
          curl -fsS "${{ secrets.KOCHEN_SUPABASE_URL }}/rest/v1/keepalive?select=id&limit=1" \
            -H "apikey: ${{ secrets.KOCHEN_SUPABASE_KEY }}"
